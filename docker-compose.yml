services:
  db:
    image: postgres:16-alpine
    container_name: vaib_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaib
      POSTGRES_PASSWORD: vaib
      POSTGRES_DB: vaib
    ports:
      - "5432:5432"
    volumes:
      - vaib_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaib -d vaib"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaib_db:
