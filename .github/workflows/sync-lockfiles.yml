name: Sincronizar lockfiles

# Regenera os package-lock.json quando um package.json muda nesta branch
# e dispara o CI em seguida. Usado porque as alteracoes desta branch foram
# enviadas pelo navegador, sem npm local. Pode ser removido depois do merge.
on:
  push:
    branches: [seguranca/hardening]
    paths: ["**/package.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerar lockfiles
        run: |
          set -e
          for d in backend frontend dashboard; do
            ( cd "$d"
              node -e '
                const fs=require("fs"),p=require("./package.json"),l=JSON.parse(fs.readFileSync("package-lock.json"));
                for (const [pai,o] of Object.entries(p.overrides||{}))
                  for (const dep of Object.keys(o)) delete l.packages[`node_modules/${pai}/node_modules/${dep}`];
                fs.writeFileSync("package-lock.json", JSON.stringify(l,null,2)+"\n");'
              npm install --package-lock-only --no-audit --no-fund
              npm audit fix --package-lock-only --no-fund || true
              echo "$d: $(npm audit 2>&1 | tail -1)"
            )
          done
      - name: Commitar e disparar o CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Lockfiles ja sincronizados"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): sincroniza package-lock.json com os package.json"
          git push
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
